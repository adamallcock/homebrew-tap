name: Cask CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        include:
          # https://docs.github.com/en/actions/reference/runners/github-hosted-runners
          - runner: macos-15
            cpu: arm64
            suffix: arm64
          - runner: macos-15-intel
            cpu: x86_64
            suffix: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    env:
      EXPECTED_CPU: ${{ matrix.cpu }}
      EXPECTED_SUFFIX: ${{ matrix.suffix }}
    steps:
      - uses: actions/checkout@v7
      - name: Verify native runner and test the updater
        run: |
          set -euo pipefail
          test "$(uname -m)" = "$EXPECTED_CPU"
          ruby -Itest -e 'Dir["test/*_test.rb"].sort.each { |file| require File.expand_path(file) }'
          ruby -c scripts/update-cask.rb
          ruby -c scripts/release-metadata.rb
          bash -n scripts/verify-app.sh
          git diff --exit-code
      - name: Update Homebrew
        run: brew update
      - name: Audit, install, and uninstall the native selection
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          brew style Casks/tibotattle.rb
          brew tap-new tibotattle/ci
          tap_path="$(brew --repository tibotattle/ci)"
          cleanup_tap() {
            result=$?
            trap - EXIT
            cleanup_result=0
            brew untrust --cask tibotattle/ci/tibotattle || cleanup_result=$?
            if rm -f "$tap_path/Casks/tibotattle.rb"; then
              brew untap tibotattle/ci || cleanup_result=$?
            else
              cleanup_result=$?
            fi
            if [[ "$result" != 0 ]]; then exit "$result"; fi
            exit "$cleanup_result"
          }
          trap cleanup_tap EXIT
          mkdir -p "$tap_path/Casks"
          cp Casks/tibotattle.rb "$tap_path/Casks/tibotattle.rb"
          cmp Casks/tibotattle.rb "$tap_path/Casks/tibotattle.rb"
          # Trust only this source-checked candidate inside the ephemeral job.
          brew trust --cask tibotattle/ci/tibotattle
          selection="$(brew info --cask --json=v2 tibotattle/ci/tibotattle)"
          jq -e '.casks[0].installed == null' <<< "$selection" >/dev/null
          version="$(jq -er '.casks[0].version' <<< "$selection")"
          expected_url="https://github.com/adamallcock/tibotattle/releases/download/v$version/TiboTattle-$version-macOS-$EXPECTED_SUFFIX.dmg"
          test "$(jq -er '.casks[0].url' <<< "$selection")" = "$expected_url"
          brew audit --cask --online tibotattle/ci/tibotattle
          appdir="$(mktemp -d "$RUNNER_TEMP/tibotattle-apps.XXXXXX")"
          brew install --cask --appdir="$appdir" tibotattle/ci/tibotattle
          bash scripts/verify-app.sh "$appdir/TiboTattle.app" "$version" "$EXPECTED_CPU"
          brew uninstall --cask tibotattle/ci/tibotattle
          test ! -e "$appdir/TiboTattle.app"
          rmdir "$appdir"
